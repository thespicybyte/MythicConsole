[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mythic-console"
description = "A Textual terminal UI for interacting with a Mythic C2 server."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "thespicybyte" }]
keywords = ["mythic", "c2", "textual", "tui", "red-team"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dynamic = ["version"]
dependencies = [
  "mythic~=0.2.11",
  "textual~=8.2.8",
  "textual-console~=0.4.0",
  "rich~=15.0.0",
  "typing_extensions~=4.16.0",
  "cmd2~=4.3.0",
]

[project.optional-dependencies]
dev = [
  "textual-dev~=1.8.0",
  "pytest~=8.3",
  "pytest-asyncio~=0.24",
  "pytest-mock~=3.14",
]

[project.scripts]
mythic-console = "mythic_console.console:main"

[project.urls]
Homepage = "https://github.com/thespicybyte/MythicConsole"
Repository = "https://github.com/thespicybyte/MythicConsole"

[tool.hatch.version]
path = "mythic_console/version.py"

[tool.hatch.build.targets.wheel]
packages = ["mythic_console"]

[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -ra -m "not live and not reference_plugin"
markers =
    live: tests that need a real Mythic server + .env (deselected by default; run with `pytest -m live`)
    reference_plugin: opt-in smoke test for a reference plugin extraction (deselected by default; run with `pytest -m reference_plugin`)
